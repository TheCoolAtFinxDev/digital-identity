server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and public endpoints to certsvc
    location /v1/ {
        proxy_pass http://di-certsvc:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://di-certsvc:8080;
        proxy_set_header Host $host;
    }

    # Angular fingerprints every build artefact, so a given file name always has
    # the same contents and can be cached hard.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached: it is the only file that names the current
    # bundle. Served with no Cache-Control, browsers cache it heuristically and
    # keep booting a previous build's main-*.js — which looks like the deploy
    # silently did nothing.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
