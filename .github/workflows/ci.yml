name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: Build and regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # NOTE: a self-hosted runner on the deployment host is the better home for
    # this job — it exercises the same rootless Podman and SELinux behaviour as
    # production. scripts/ci.sh is the same either way; only `runs-on` changes.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install podman-compose
        run: |
          podman --version
          python3 -m pip install --user podman-compose
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run CI
        env:
          CI_API_PORT: '18080'
          CI_ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD || 'ci_admin_password_not_for_deployment' }}
        run: bash scripts/ci.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: .ci/logs/
          retention-days: 7
          if-no-files-found: ignore
